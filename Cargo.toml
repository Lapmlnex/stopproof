[package]
name = "stopproof"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Test-command and Git evidence receipts for coding agents and CI."
license = "MIT"
repository = "https://github.com/Lapmlnex/stopproof"
keywords = ["claude-code", "hooks", "agent", "verification", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"
